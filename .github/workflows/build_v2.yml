# v2.1 - 류호선
#   DOCKER_SECRETS 를 추가하였습니다. (하위 호환성 유지)
# v2.2 - 류호선
#   submodules: recursive 추가
# v2.3 - 류호선
#   - helmRepository 입력값을 추가하였습니다. (기본값: 'jce-service-helm')
#   - buildContext 입력값을 추가하였습니다. (기본값: '.')
# v2.4 - 류호선
#   - buildContext 존재 시, 빌드 태그에 prefix로 추가합니다.
#   - yq를 사용하여 수동으로 태그 업데이트
# v2.5 - 류호선
#   - Helm 차트 수정 부분을 별도의 job 으로 분리하였습니다.
#   - concurrency 를 job 별로 설정하였습니다.
#   - build 단계에서 브랜치의 최신 커밋을 체크아웃하도록 수정하였습니다.
# v2.6 - 류호선
#   - update-tag job을 matrix로 처리
#   - matrix에 main이 없는 경우 main을 추가
# v2.7 - 박기영
#   - AWS 인증을 access key에서 OIDC role assume 방식으로 변경
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY secrets 제거
# v2.8 - 박기영
#   - workflow level outputs에 tag 추가
# v2.9 - 류호선
#   - freeDiskSpace 옵션 추가 (기본값: false)
#   - true 시 빌드 전 사전 설치 도구 제거로 ~14GB 디스크 확보
# v2.10 - 이창환
#   - build-push 에 provenance: false 추가
#   - attestation 으로 인한 OCI image index 생성을 막아 ECR BASIC 스캔 정상화
name: Build

on:
  workflow_call:
    inputs:
      # gha
      runner:
        required: false
        type: string
        default: ubuntu-22.04
      # Common
      env:
        required: true
        type: string
      target:
        required: true
        type: string
      propertyPath:
        required: false
        type: string
        default: 'image.tag'
      buildArgs:
        required: false
        type: string
      # interface UpdateTarget = {
      #   "registry": string;
      #   "imageName": string;
      #   "valueFilePath": string[];
      # }
      # interface UpdateTargets = {
      #   "aws": UpdateTarget;
      #   "ncp": UpdateTarget;
      # }
      updateTargets:
        required: true
        type: string
      dockerTarget:
        required: false
        type: string
        description: Docker target. It uses the value of `env` if not specified.
      helmRepository:
        required: false
        type: string
        default: jce-service-helm
      helmUpdateTargets:
        required: false
        type: string
        description: JSON array of repository, propertyPath and valueFilePath entries. Defaults to the existing Helm inputs.
      buildContext:
        required: false
        type: string
      freeDiskSpace:
        required: false
        type: boolean
        default: false
        description: Free disk space before build by removing pre-installed tools (.NET, Haskell, Boost, etc.)

    outputs:
      tag:
        description: The image tag
        value: ${{ jobs.build-image.outputs.tag }}

    secrets:
      NCP_ACCESS_KEY_ID:
        required: false
      NCP_SECRET_KEY:
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        required: true
      DOCKER_SECRETS:
        required: false

jobs:
  # 1. 도커 이미지를 빌드하고 푸시합니다.
  build-image:
    runs-on: ${{ inputs.runner }}
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.name-tag.outputs.tag }}
      helm_targets: ${{ steps.set-json.outputs.helm_targets }}

    # 동시성 제어 설정
    # concurrency
    #   - env간 분리
    #   - dockerTarget 이 존재하는 경우 dockerTarget간 분리
    #   - PRD 환경에서 동시성 1로 제한 + 진행 중인 작업 취소
    concurrency:
      group: build-image/${{ inputs.env }}${{ inputs.dockerTarget && format('/{0}', inputs.dockerTarget) }}${{ inputs.env != 'prd' && format('/{0}', github.run_id) || '' }}
      cancel-in-progress: ${{ inputs.env == 'prd' }}

    steps:
    - name: Free disk space
      if: ${{ inputs.freeDiskSpace }}
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$RUNNER_TOOL_CACHE"

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_name }} # 브랜치의 최신 커밋을 체크아웃합니다.
        submodules: recursive # 서브모듈 초기화
        fetch-depth: 0

    # buildx는 빠른 도커 백엔드입니다. 빌드 속도 개선을 위해 추가했습니다.
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Name tag
      id: name-tag
      env:
        CONTEXT: ${{ inputs.buildContext }}
      run: |
        PREFIX=''
        if [ -n "$CONTEXT" ]; then
          PREFIX="$CONTEXT-"
        fi
        echo "tag=${PREFIX}$(TZ='Asia/Seoul' date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

    - name: Set up JSON file
      id: set-json
      env:
        UPDATE_TARGETS: ${{ inputs.updateTargets }}
        HELM_UPDATE_TARGETS: ${{ inputs.helmUpdateTargets }}
        HELM_REPOSITORY: ${{ inputs.helmRepository }}
        PROPERTY_PATH: ${{ inputs.propertyPath }}
      run: |
        printf '%s\n' "$UPDATE_TARGETS" > updateTargets.json
        if [ -n "$HELM_UPDATE_TARGETS" ]; then
          helm_targets=$(jq -c . <<< "$HELM_UPDATE_TARGETS")
        else
          helm_targets=$(jq -c --arg repository "$HELM_REPOSITORY" --arg property "$PROPERTY_PATH" \
            '[{repository: $repository, propertyPath: $property, valueFilePath: [.[] | .valueFilePath[] | select(. != null and . != "null")]}]' updateTargets.json)
        fi
        echo "helm_targets=$helm_targets" >> "$GITHUB_OUTPUT"

    - name: Check for platform presence
      id: check-platform
      run: |
        CONTAINS_AWS=$(jq -r 'has("aws")' updateTargets.json)
        CONTAINS_NCP=$(jq -r 'has("ncp")' updateTargets.json)
        
        echo "contains_aws=$CONTAINS_AWS" >> $GITHUB_OUTPUT
        echo "contains_ncp=$CONTAINS_NCP" >> $GITHUB_OUTPUT

    # AWS 관련 작업
    - name: Configure AWS credentials
      if: ${{ steps.check-platform.outputs.contains_aws == 'true' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::631535140228:role/ped-role-github-actions
        aws-region: ap-northeast-2

    - name: Login to Amazon ECR
      if: ${{ steps.check-platform.outputs.contains_aws == 'true' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # NCP 관련 작업
    - name: Login to NCP Container Registry
      if: ${{ steps.check-platform.outputs.contains_ncp == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ fromJSON(inputs.updateTargets).ncp.registry }}
        username: ${{ secrets.NCP_ACCESS_KEY_ID }}
        password: ${{ secrets.NCP_SECRET_KEY }}
        logout: false

    - name: Set tags
      id: tags
      run: |
        TAGS=""
        for type in $(jq -r 'keys[]' updateTargets.json); do
          TARGET=$(jq -r ".$type" updateTargets.json)

          if [ "$type" == "aws" ]; then
            AWS_IMAGE_NAME=$(echo "$TARGET" | jq -r '.imageName')

            TAG="${{ steps.login-ecr.outputs.registry }}/${AWS_IMAGE_NAME}:${{ steps.name-tag.outputs.tag }}"

            if [ -n "$TAGS" ]; then
              TAGS="$TAGS,$TAG"
            else
              TAGS="$TAG"
            fi
          elif [ "$type" == "ncp" ]; then
            NCP_REGISTRY=$(echo "$TARGET" | jq -r '.registry')
            NCP_IMAGE_NAME=$(echo "$TARGET" | jq -r '.imageName')

            TAG="${NCP_REGISTRY}/${NCP_IMAGE_NAME}:${{ steps.name-tag.outputs.tag }}"

            if [ -n "$TAGS" ]; then
              TAGS="$TAGS,$TAG"
            else
              TAGS="$TAG"
            fi
          fi
        done
        echo "tags=$TAGS" >> $GITHUB_OUTPUT

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        # ECR BASIC 스캔은 OCI image index 를 못 읽으므로 단일 매니페스트로 강제 (단일 amd64 빌드라 attestation 손실 없음)
        provenance: false
        tags: ${{ steps.tags.outputs.tags }}
        secrets: |
          ${{ secrets.DOCKER_SECRETS }}
        build-args: ${{ inputs.buildArgs }}
        context: ${{ inputs.buildContext }}
        target: ${{ inputs.dockerTarget || inputs.env }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 2. Helm 차트의 이미지를 업데이트하고 커밋합니다.
  update-tag:
    runs-on: ${{ inputs.runner }}
    needs: build-image
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'main' && '["main"]' || format('[{0},"main"]', toJSON(inputs.target))) }}
        helm: ${{ fromJSON(needs.build-image.outputs.helm_targets) }}

    # 동시성 제어 설정
    # concurrency
    #   - target간 분리
    concurrency:
      group: update-tag/${{ matrix.target }}/${{ matrix.helm.repository }}
      cancel-in-progress: false

    steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: Iv23li2cfUIFIR5gL3Bp
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: team-monolith-product
        repositories: ${{ matrix.helm.repository }}
        permission-contents: write

    - name: Checkout to Helm Repository
      uses: actions/checkout@v7
      with:
        repository: team-monolith-product/${{ matrix.helm.repository }}
        path: ${{ matrix.helm.repository }}
        token: ${{ steps.app-token.outputs.token }}
        ref: ${{ matrix.target }}

    - name: Set changes
      id: changes
      env:
        HELM_TARGET: ${{ toJSON(matrix.helm) }}
        IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
      run: |
        changes=$(jq -c --arg tag "$IMAGE_TAG" \
          '.propertyPath as $path | reduce .valueFilePath[] as $file ({}; .[$file][$path] = $tag)' <<< "$HELM_TARGET")
        echo "changes=$changes" >> "$GITHUB_OUTPUT"

    # 주피터와 공통으로 사용할 수 있도록 yq를 사용하여 Helm 차트의 값을 수정합니다.
    # yaml-update-action 을 사용하는 경우에, 적용된 merge 문법들이 모두 랜더링 되는 현상이 발생합니다.
    # https://github.com/team-monolith-product/jce-jupyter-hub-helm/commit/1520f9b003cdd9e79c872fbe7a636a92756b6eac
    - name: Modify Helm Chart
      uses: mikefarah/yq@v4
      env:
        CHANGES: ${{ steps.changes.outputs.changes }}
        HELM_REPOSITORY: ${{ matrix.helm.repository }}
      with:
        cmd: | # sh shell
          apk add --no-cache jq

          for change in $(echo "$CHANGES" | jq -c 'to_entries[]'); do
            FILE=$(echo "$change" | jq -r '.key')

            for kv in $(echo "$change" | jq -c '.value | to_entries[]'); do
              VALUE_PATH=$(echo "$kv" | jq -r '.key')
              VALUE=$(echo "$kv" | jq -r '.value')

              P=".$VALUE_PATH" V="$VALUE" \
              yq eval -i 'eval(strenv(P)) = strenv(V)' "$HELM_REPOSITORY/$FILE"
            done
          done

    - name: Commit and Push
      env:
        TARGET: ${{ matrix.target }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        HELM_REPOSITORY: ${{ matrix.helm.repository }}
        IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
      run: |
        cd "$HELM_REPOSITORY" || exit 1
        BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
        git add .
        if git diff --cached --quiet; then
          echo "Image tag is already current"
          exit 0
        fi
        git commit -m "auto: Update Image Tag to $IMAGE_TAG"
        git push origin "$TARGET"
